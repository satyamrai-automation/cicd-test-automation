name: Terraform CI Pipeline

on:
  push:
    branches:
      - feature/**
      - develop

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

jobs:
  terraform-ci:
    name: Terraform Validation Pipeline

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: eniverment/dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: Verify Terraform Version
        run: terraform version

      - name: Display Working Directory
        run: pwd

      - name: Display Repository Files
        run: ls -R


      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Initialize
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false
        env:
          ARM_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
          ARM_SUBSCRIPTION_ID: "00000000-0000-0000-0000-000000000000"
          ARM_TENANT_ID: "00000000-0000-0000-0000-000000000000"
          ARM_CLIENT_SECRET: "dummy"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: eniverment/dev/tfplan

      - name: Pipeline Completed
        run: echo "Terraform CI Pipeline Completed Successfully!"